# Example server block. Copy the release's index.html and sw.js to this root.
# Add TLS or use your existing HTTPS reverse proxy for installed offline support.
server {
    listen 8080;
    server_name _;
    root /srv/circuitbench;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
